name: Publish Logseq plugin

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  PLUGIN_NAME: logseq-block-to-page-db

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify
        run: npm run check

      - name: Build release zip
        run: |
          mkdir -p "release/${PLUGIN_NAME}"
          cp -R README.md LICENSE package.json icon.svg index.html main.js src vendor assets "release/${PLUGIN_NAME}/"
          cd release
          zip -r "${PLUGIN_NAME}.zip" "${PLUGIN_NAME}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/${{ env.PLUGIN_NAME }}.zip
            package.json
